Name:
  TargetLanguage: English
  Value: Hostile Intelligence
Data:
  Flags:
  - RunOnce
  - WarnOnAliasFillFailure
  - 0x10000
  Priority: 70
  Unused: 0x000000
QuestType: 0475FD:Starfield.esm
QuestFaction: 0546DC:Starfield.esm
Summary: >-
  Hadrian and Percial have formed a plan on how to stop the Terrormorphs - remove them from human worlds by either hunting them down using creatures called "Aceles" or wiping them out with a microbe. In order to prove out either plan, though, they'll need some raw materials. And the place to collect those - Londinion.


  The player, Hadrian, Percival, and Kaiser head to Londinion to collect those materials, but discover a plant - the Lazarus Plant - that might've been used to trigger the attacks on New Atlantis and Tau Ceti. The player and Hadrian then discover a lead to who might've known about the plant - Hadrian's father, Vae Victis.
