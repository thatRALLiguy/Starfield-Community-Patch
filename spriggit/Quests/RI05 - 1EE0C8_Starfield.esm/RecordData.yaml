Summary: >-
  Dalton sends the player to track down Imogene Salzo for questioning to learn about Infinity LTDs plans. They find her ready and waiting at the Seokga Syndicate hideout where they can determine her fate. She claims Ularu Chen has set her up and is the ultimate person behind everything. The player can believe her and take the evidence she has against Ularu, or they kill her. The player then returns to Dalton to relay what they believe to be the truth.


  Additionally, the player may encounter Benjamin Bayu where they can strike a deal to make their entry into the Seokga Syndicate's hideout easier, and they can also choose to confront Ularu about Imogene's accusations.
