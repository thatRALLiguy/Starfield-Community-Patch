  LogEntries:
  - Flags: []
    Note: Startup stage - enable thieves and set first objective
    Entry:
      TargetLanguage: English
      Value: Theresa Mason suspects that some of her customers might be planning to rob the UC Surplus. I should talk to her and find out what I can do to help.
    StageCompleteDatas:
    - QSRD: 0x00000000
    - QSRD: '[]'
- Index: 1
  Unknown: 171
  LogEntries:
  - Flags: []
    Note: Top level startup stage - enable thieves, do not set objective displayed
    StageCompleteDatas:
    - QSRD: 0x00000000
    - QSRD: '[]'
- Index: 10
  Unknown: 171
  LogEntries:
  - Flags: []
    Note: Player spoke to Theresa Mason and started the quest.
    Entry:
      TargetLanguage: English
      Value: Theresa asked me to find the thieves and see if I can figure out what they're planning. I should go to the UC Surplus and listen in on their conversation.
    StageCompleteDatas:
    - QSRD: 0x00000000
    - QSRD: '[]'
- Index: 15
  Unknown: 171
  LogEntries:
  - Flags: []
    Note: Player hit trigger. Update to "Listen" objective
    Entry:
      TargetLanguage: English
      Value: I found the thieves outside the UC Surplus. I should listen in and see if I can figure out what they're planning.
    StageCompleteDatas:
    - QSRD: 0x00000000
    - QSRD: '[]'
- Index: 20
  Unknown: 171
  LogEntries:
  - Flags: []
    Note: 'Player spoke to the thieves about their plan or overheard it '
    Entry:
      TargetLanguage: English
      Value: Those two men are definitely planning to rob the UC Surplus. I should report what I've learned back to Theresa at Kay's House.
    StageCompleteDatas:
    - QSRD: 0x00000000
    - QSRD: '[]'
- Index: 30
  Unknown: 171
  LogEntries:
  - Flags: []
    Note: Player told Theresa they'd report to security
    Entry:
      TargetLanguage: English
      Value: 'Theresa asked me to report the robbery to Officer Karson Endler at UC Security in the Well. I should head to the office right away. '
    StageCompleteDatas:
    - QSRD: 0x00000000
    - QSRD: '[]'
- Index: 40
  Unknown: 171
  LogEntries:
  - Flags: []
    Note: Player told Theresa they'd handle it themselves
    Entry:
      TargetLanguage: English
      Value: I can stop the robbery myself. I need to take care of the thieves before they have a chance to rob the UC Surplus.
    StageCompleteDatas:
    - QSRD: 0x00000000
    - QSRD: '[]'
- Index: 45
  Unknown: 171
  LogEntries:
  - Flags: []
    Note: Make thieves hostile phase
    Entry:
      TargetLanguage: English
      Value: The thieves heard I was trying to stop them and attacked me. I should get rid of them before they do the same to me.
    StageCompleteDatas:
    - QSRD: 0x00000000
    - QSRD: '[]'
- Index: 47
  Unknown: 171
  LogEntries:
  - Flags: []
    Note: Player told Endler Theresa made the report
    StageCompleteDatas:
    - QSRD: 0x00000000
    - QSRD: '[]'
- Index: 50
  Unknown: 171
  LogEntries:
  - Flags: []
    Note: Player spoke to Officer Endler
    Entry:
      TargetLanguage: English
      Value: I found Officer Endler at the UC Security office in the Well. He said he'll head over to check for the thieves right away.
    StageCompleteDatas:
    - QSRD: 0x00000000
    - QSRD: '[]'
- Index: 55
  Unknown: 171
  LogEntries:
  - Flags: []
    Note: Officer Endler goes to check out the thieves.
    Entry:
      TargetLanguage: English
      Value: Officer Endler's on his way to make sure the thieves don't try anything. I should  tell Theresa about this.
    StageCompleteDatas:
