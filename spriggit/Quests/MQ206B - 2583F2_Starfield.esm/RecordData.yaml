Summary: MATTEO KHATRI tells the player that, during the Hunter's attack, he mentioned the word "Unity." This word has significance to Matteo's religion, the Sanctum Universum. He asks the player to come with him to meet KEEPER AQUILUS, the reglion's founder, to see if the word has hidden meaning. Aquilus tells the player to speak to all the faiths, not just his own, to uncover the word's true meaning.
