Summary: The new Trackers Alliance HQ is in the heart of Akila City. Thematically, it's somewhere between an air-force bar and a hunting lodge, if the quarries were other people. Several Trackers hang out inside, dispensing wisdom and telling stories. There is an upstairs area accessible to anyone, and a lower basement lounge area that is only for official Trackers.
