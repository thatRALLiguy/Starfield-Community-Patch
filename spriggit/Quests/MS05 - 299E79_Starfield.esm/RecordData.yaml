Summary: Stroud-Eklund Shipyards is having difficulty with their latest project. No one can agree on anything, and production has stalled. Walter Stroud has asked the player to step in and try to get production back on track by going to the staryard and working with his R&D team. They face a number of problems ranging from budget concerns, requiring more market research data, and interpersonal issues. The player will solve these issues, and a ship will be built based on the decisions they made.
