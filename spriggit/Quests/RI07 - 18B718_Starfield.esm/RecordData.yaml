TextDisplayGlobals:
- 158624:Starfield.esm
Summary: "The player gets to attend their first board meeting where the truth about the mole and Masako's plans for Infinity LTD revealed. With the Internal Neuroamp completed, the player finally gets it implanted with the opportunity to test it out. Afterwards, they meet back up with Masako in her office where they are briefed on the plan. The player is given a special \"Overseer\" program to run on Lucas Drexler and Faye Sengsavahn's computers in order to wipe all references to Ryujin and Project Dominion, while at the same time collecting evidence for Infinity's crimes: unathorized human trials at the Clinic, and hiring mercenaries to take out the innocent workers at CM Station RC-1. Finally, the player will grab the final prototype that Infinity has as the last piece of evidence that Project Dominion ever existed. Before they can return to Ryujin, they need to drop off the slate with the evidence on it at SSNN, ensuring David Barron's interest is peaked so the story will be sure to air. Once the player returns to Masako at Ryujin Tower, they'll listen to the broadcast together which may or may not be in Masako's favor."
