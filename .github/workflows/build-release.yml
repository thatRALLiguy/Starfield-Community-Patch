name: Verify recovered SFCP baseline

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify frozen source and original release files
        run: python tools/verify_baseline.py --package dist/SFCP-1.0.0-reference.zip
      - name: Check verification failure cases
        run: python -m unittest discover -s tools -p test_*.py
      - name: Upload historical reference artifact
        uses: actions/upload-artifact@v4
        with:
          name: SFCP-1.0.0-reference-not-a-new-release
          path: dist/SFCP-1.0.0-reference.zip
          if-no-files-found: error
